# ~/.config/alacritty/alacritty.toml

# Import theme
import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

# Environment variables
[env]
TERM = "xterm-256color"

# Window settings
[window]
opacity = 0.90  # Correct key is 'opacity', not 'background_opacity'

# Font configuration
[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
