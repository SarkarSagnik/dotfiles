general {
    # Visual styling (Gaps and Sharp corners)
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    resize_on_border = true
    allow_tearing = true
    col.active_border = rgba(d79921ee) rgba(ebdbb2ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    # Sharp corners look snappier than rounded ones
    rounding = false 
    active_opacity = 0.95
    inactive_opacity = 0.85
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    
    shadow {
        enabled = false
    }
}

animations {
    enabled = yes

    # "easeOutExpo" is the best curve for snappy feels.
    # It starts fast and stops immediately.
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    # I have lowered all numbers to 2 or 3 (200ms - 300ms)
    # This is the "Blink and you miss it" speed.
    
    animation = global, 1, 3, default
    animation = border, 1, 3, default
    animation = windows, 1, 3, easeOutExpo
    animation = windowsIn, 1, 3, easeOutExpo, slide # popin 80% is also good here
    animation = windowsOut, 1, 3, easeOutExpo, slide
    animation = fade, 1, 3, easeOutExpo
    animation = workspaces, 1, 3, easeOutExpo, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}
