general {
    # Visual styling (Gaps and Sharp corners)
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    resize_on_border = true
    allow_tearing = true  # Set to false if tearing occurs; good for gaming on VRR monitors
    # Active border gradient (current: nord)
    # Alternatives:
    # tokyonight: rgba(88c0d0ee) rgba(81a1c1ee) 45deg
    # gruvbox: rgba(d79921ee) rgba(ebdbb2ee) 45deg
    # everforest: rgba(a7c080ee) rgba(7fbbb3ee) 45deg
    col.active_border = rgba(8aadf4ee) rgba(b7bdf8ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.8

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        offset = 0 1
        range = 4
    }
}


 animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, once
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
    animation = fadeDim, 1, 4, liner
 }

