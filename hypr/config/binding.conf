######################################
###        GLOBAL VARIABLES        ###
######################################

$mainMod     = SUPER
$terminal    = ghostty
$browser     = helium
$fileManager = nautilus
$editor      = nvim
$menu        = wofi --show drun


######################################
###        CORE LAUNCHERS          ###
######################################

# Core Apps
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod SHIFT, N, exec, $editor

# System Monitors & Tools
bind = $mainMod SHIFT, T, exec, $terminal -e 'btop'
bind = $mainMod SHIFT, M, exec, flatpak run com.spotify.Client
bind = $mainMod SHIFT, G, exec, flatpak run org.signal.Signal
bind = $mainMod SHIFT, Z, exec, flatpak run app.zen_browser.zen
bind = $mainMod SHIFT, O, exec, flatpak run md.obsidian.Obsidian --disable-gpu --enable-wayland-ime

# Creative & Web Apps
#bind = $mainMod SHIFT, E, exec, flatpak run com.blackmagicdesign.resolve
bind = $mainMod SHIFT, Y, exec, $browser https://youtube.com/
bind = $mainMod SHIFT, W, exec, $browser https://web.whatsapp.com/

bind = $mainMod SHIFT ALT, X, exec, $browser https://x.com/compose/post


######################################
###         WINDOW CONTROL          ###
######################################

bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, M, exit


######################################
###        WINDOW MOVEMENT          ###
######################################

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

######################################
###          WORKSPACES             ###
######################################

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic


######################################
###        MOUSE + MOVEMENT         ###
######################################

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move / Resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


######################################
###         MEDIA CONTROLS          ###
######################################

# Audio
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/volnoti.sh up # wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/volnoti.sh down #wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, ~/.local/bin/volnoti.sh mute #wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/brinoti.sh up #brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/brinoti.sh down #brightnessctl s 10%-

# Playback
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause


######################################
###        POWER & SESSION          ###
######################################

bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod CTRL, R, exec, systemctl reboot
bind = $mainMod CTRL, P, exec, systemctl poweroff
bind = $mainMod CTRL, S, exec, systemctl suspend


######################################
###         QUALITY OF LIFE         ###
######################################

# Screenshots
#Hyprshot
bind = $mainMod, S, exec, hyprshot -m window
bind = $mainMod SHIFT, S, exec, hyprshot -m region

#wallpaper & themes
bind = $mainMod CTRL, SPACE, exec, ~/.local/bin/next-wallpaper.sh


# Reload Hyprland
bind = $mainMod SHIFT, R, exec, hyprctl reload

#wallpaper switch
#bind = $mainMod CTRL, SPACE, exec, ~/.config/hypr/config/wallpaper.conf
