env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24

exec-once = hyprctl setcursor capitaine-cursors 28

# Cursor settings
cursor {
    no_hardware_cursors = true  # Set to false for Intel/AMD GPUs
}

# Nvidia-specific (current GPU)
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_SCALE_FACTOR,1
env = __GL_SHADER_DISK_CACHE,1  # Cache shaders for better performance in games


# For Intel GPU (uncomment if switching)
# env = LIBVA_DRIVER_NAME,i965  # or iHD for newer Intel GPUs

# For AMD GPU (uncomment if switching)
# env = RADV_PERFTEST=all

# Force all apps to use Wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland

# Allow better support for screen sharing (Google Meet, Discord, etc)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

xwayland {
  force_zero_scaling = true
}



