# Environment variables for cursor theme
#env = HYPRCURSOR_THEME,Bibata-Modern-Ice
#env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24


#QT Theming
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
#env = QT_STYLE_OVERRIDE,Gruvbox-BL-MB-Dark


# Apply cursor via hyprctl (ensures runtime application)
exec-once = hyprctl setcursor capitaine-cursors 28

# Use gsettings for GTK apps
#exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
#exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# Cursor settings
cursor {
    no_hardware_cursors = true
}

# Nvidia-specific
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_SCALE_FACTOR,1


