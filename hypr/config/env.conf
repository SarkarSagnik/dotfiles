# Environment variables for cursor theme
env = HYPRCURSOR_THEME,Qogir-cursors
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Qogir-cursors
env = XCURSOR_SIZE,24

# Apply cursor via hyprctl (ensures runtime application)
exec-once = hyprctl setcursor Qogir-cursors 24

# Use gsettings for GTK apps
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Qogir-cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# Cursor settings
cursor {
    no_hardware_cursors = true
}

# Misc settings
misc {
    disable_hyprland_qtutils_check = true
}
