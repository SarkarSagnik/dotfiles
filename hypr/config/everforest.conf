# Everforest Color Palette

# --- Base Colors ---
$base = #2A2E2B        # Dark background color (Everforest base)
$surface0 = #1F1F1A    # Light dark surface (input background)
$text = #D1D1A8        # Text color (light grayish yellow)
$textAlpha = rgba(209, 209, 168, 0.8)   # Semi-transparent text color

# --- Accent Colors ---
$accent = #8A9E7D      # Accent color (muted green)
$accentAlpha = rgba(138, 158, 125, 0.75)  # Accent with transparency

# --- Error / Warning Colors ---
$red = #F2C6A0         # Error / fail color (light orange)
$yellow = #F2C6A0      # Yellow accent color (used for capslock warning)

# --- Background Colors ---
$background = #2A2E2B  # Main background (dark)
$surface1 = #1F1F1A    # Light surface for inputs and certain elements

# --- Neutral Colors ---
$neutral1 = #383B36    # Slightly lighter neutral color (used for borders, shadows)
$neutral2 = #4D5045    # Mid-tone neutral (shadows, subtext)

# --- Green Colors (For accents) ---
$green = #8A9E7D       # Main green accent color (used in labels, highlights)

# --- Blue Colors (Rare, for highlights) ---
$blue = #A4B8C4        # Optional blue accent for select UI elements

# --- Additional Useful Colors ---
$orange = #F2C6A0      # For failure messages (light orange)
$purple = #6A6177      # Optional purple accent for certain elements

