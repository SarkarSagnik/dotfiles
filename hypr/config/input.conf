cursor {
    no_hardware_cursors = false
    hide_on_key_press = true
}

device {
    name = epic-mouse-v1
    sensitivity = 0
}

xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = false
}

monitor=,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    repeat_rate = 50
    repeat_delay = 300
    touchpad {
        natural_scroll = true
    }
}
