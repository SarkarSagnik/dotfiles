# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Hyprland 0.53+ syntax

# Suppress maximize event for all windows
windowrule = match:class .*, suppress_event maximize

# Tag all windows for default opacity (apps can override with -default-opacity tag)
windowrule = match:class .*, tag +default-opacity

# Fix some dragging issues with XWayland - disabled due to syntax issues in 0.53+
# windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, nofocus

# Apply default opacity after apps have had a chance to opt out
windowrule = match:tag default-opacity, opacity 0.97 0.9

# PiP windows - allow resize with mouse
windowrule = match:title ^Picture-in-Picture$, float on
windowrule = match:title ^Picture-in-Picture$, size 400 225
windowrule = match:title ^Picture-in-Picture$, move 75% 75%
windowrule = match:title ^Picture-in-Picture$, pin on
