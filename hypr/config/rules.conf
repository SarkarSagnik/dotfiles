# ----------------------------------------------------------------------
# Brave/Chromium PiP Fix
# ----------------------------------------------------------------------
# You MUST replace the regex in $brave_pip_target with the actual
# 'initialClass' or 'title' you find by running 'hyprctl clients'
# while the Brave PiP window is open.
#
# A common pattern is: initialClass:^(crx_gppdlegmmpjhiinjhmdhmgfgdggflchg)$
$brave_pip_target = initialClass:^(<YOUR_BRAVE_PIP_ID_HERE>)$

# Apply the PiP properties to the identified Brave PiP window
windowrulev2 = float, $brave_pip_target
windowrulev2 = pin, $brave_pip_target
windowrulev2 = keepaspectratio, $brave_pip_target
windowrulev2 = size 15%, $brave_pip_target
windowrulev2 = move 75% 65%, $brave_pip_target
windowrulev2 = noshadow, $brave_pip_target


# ----------------------------------------------------------------------
# Original PiP Rules (Works for Firefox, etc.)
# ----------------------------------------------------------------------
# Targets windows that correctly report their title as "Picture-in-Picture"
$firefox_pip_target = title:^(Picture-in-Picture|Pip)$

windowrulev2 = float, $firefox_pip_target
windowrulev2 = pin, $firefox_pip_target
windowrulev2 = keepaspectratio, $firefox_pip_target
windowrulev2 = size 15%, $firefox_pip_target
windowrulev2 = move 75% 65%, $firefox_pip_target
windowrulev2 = noshadow, $firefox_pip_target


# ----------------------------------------------------------------------
# General Window Management Rules
# ----------------------------------------------------------------------

# Ignore maximize requests (Original rule)
windowrulev2 = suppressevent maximize, class:.*

# Fix XWayland drag issues (Original rule)
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
