# ----------------------------------------------------------------------
# Modern PiP Rules for All Browsers
# ----------------------------------------------------------------------
# Firefox-based (Firefox, Zen, etc.) use title: Picture-in-Picture
# Chromium-based (Brave, Chrome, etc.) use initialClass starting with crx_

# Universal PiP rules (covers most cases)
windowrulev2 = float, title:(Picture-in-Picture|Pip)
windowrulev2 = pin, title:(Picture-in-Picture|Pip)
windowrulev2 = keepaspectratio, title:(Picture-in-Picture|Pip)
windowrulev2 = size 15%, title:(Picture-in-Picture|Pip)
windowrulev2 = move 75% 65%, title:(Picture-in-Picture|Pip)
windowrulev2 = noshadow, title:(Picture-in-Picture|Pip)

# For Chromium PiP extensions (Brave, etc.), find the class with 'hyprctl clients'
# Common pattern: initialClass:(crx_.*)
windowrulev2 = float, initialClass:(crx_.*)
windowrulev2 = pin, initialClass:(crx_.*)
windowrulev2 = keepaspectratio, initialClass:(crx_.*)
windowrulev2 = size 15%, initialClass:(crx_.*)
windowrulev2 = move 75% 65%, initialClass:(crx_.*)
windowrulev2 = noshadow, initialClass:(crx_.*)


# ----------------------------------------------------------------------
# General Window Management Rules
# ----------------------------------------------------------------------

# Ignore maximize requests (Original rule)
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nomaximizerequest, class:.*

# Fix XWayland drag issues (Original rule)
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Allow tearing for web browsers to prevent flickering
windowrulev2 = allowtearing, class:(firefox|zen|brave|chromium|chrome|vivaldi|helium)
