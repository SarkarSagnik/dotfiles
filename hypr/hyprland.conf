################################################################
#                                                              #
#                 H Y P R L A N D   C O N F I G                #
#                                                              #
#                Clean, Optimized, and Segregated              #
#                                                              #
################################################################

# ========================================
# AUTOSTART APPLICATIONS
# ========================================

source = ./dms/cursor.conf
exec-once = dms run
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store

# ========================================
# ENVIRONMENT & SYSTEM VARIABLES
# ========================================

env = GDK_SCALE,1
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = __GL_SHADER_DISK_CACHE,1

# ========================================
# CURSOR & XWAYLAND SETTINGS
# ========================================

cursor {
    no_hardware_cursors = true
    hide_on_key_press = true
}

xwayland {
    force_zero_scaling = true
}

# ========================================
# MONITOR CONFIGURATION
# ========================================

monitor=,preferred,auto,1

# ========================================
# INPUT DEVICES
# ========================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    repeat_rate = 50
    repeat_delay = 300
    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = 0
}

# ========================================
# APPEARANCE & THEMING
# ========================================

$activeBorderColor = rgba(8aadf4ee) rgba(b7bdf8ee) 45deg
$inactiveBorderColor = rgba(595959aa)

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.8
    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = false
    }
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = -1
    col.border_locked_inactive = -1
    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal
        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0
        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)
        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

# ========================================
# ANIMATIONS
# ========================================

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 0, ease
}

# ========================================
# LAYOUT CONFIGURATIONS
# ========================================

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# ========================================
# GLOBAL VARIABLES
# ========================================

$mainMod = SUPER
$terminal = ghostty
$browser = helium-browser
$fileManager = nautilus
$editor = nvim
$menu = wofi --show drun

# ========================================
# KEYBINDINGS
# ========================================

# -- CORE APPLICATIONS --
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod SHIFT, N, exec, $terminal -e 'nvim'

# -- SYSTEM MONITORS & TOOLS --
bind = $mainMod SHIFT, T, exec, $terminal -e btop
bind = $mainMod SHIFT, D, exec, $terminal -e lazydocker
bind = $mainMod SHIFT, K, exec, hyprctl kill
bind = $mainMod SHIFT, G, exec, flatpak run org.signal.Signal
bind = $mainMod SHIFT, Z, exec, flatpak run app.zen_browser.zen
bind = $mainMod SHIFT, O, exec, obsidian -disable-gpu --enable-wayland-ime

# -- GAMING LAUNCHERS --
bind = $mainMod ALT, S, exec, steam
bind = $mainMod ALT, L, exec, lutris

# -- WEB APPLICATIONS --
bind = $mainMod SHIFT, Y, exec, $browser --disable-gpu-compositing --enable-features=UseOzonePlatform --ozone-platform=wayland --profile-directory=Default --app=https://youtube.com/
bind = $mainMod ALT, M, exec, $browser --disable-gpu-compositing --enable-features=UseOzonePlatform --ozone-platform=wayland --profile-directory=Default --app=https://music.youtube.com/
bind = $mainMod SHIFT, W, exec, $browser --disable-gpu-compositing --enable-features=UseOzonePlatform --ozone-platform=wayland --profile-directory=Default --app=https://web.whatsapp.com/
bind = $mainMod SHIFT, X, exec, $browser --disable-gpu-compositing --enable-features=UseOzonePlatform --ozone-platform=wayland --profile-directory=Default --app=https://x.com/
bind = $mainMod SHIFT ALT, X, exec, $browser --disable-gpu-compositing --enable-features=UseOzonePlatform --ozone-platform=wayland --profile-directory=Default --app=https://x.com/compose/post

# -- DRM STREAMING --
bind = $mainMod ALT, N, exec, $browser2 --profile-directory=Default --app=https://www.netflix.com/browse
bind = $mainMod ALT, P, exec, $browser2 --profile-directory=Default --app=https://www.primevideo.com/region/eu/storefront?ref_=atv_pr_sw_sc
bind = $mainMod ALT, F, exec, $browser2 --profile-directory=Default --app=https://www.fancode.com/
bind = $mainMod ALT, H, exec, $browser2 --profile-directory=Default --app=https://www.hotstar.com/in/home
bind = $mainMod ALT, A, exec, $browser2 --profile-directory=Default --app=https://www.airtelxstream.in/

# -- WINDOW MANAGEMENT --
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exit

# -- WINDOW MOVEMENT --
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, TAB, cyclenext
bind = $mainMod, j, movefocus, d

# -- WORKSPACE MANAGEMENT --
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Resize submap
bind = $mainMod, R, submap, resize
submap = resize
bind = , h, resizeactive, -20 0
bind = , j, resizeactive, 0 20
bind = , k, resizeactive, 0 -20
bind = , l, resizeactive, 20 0
bind = , escape, submap, reset
submap = reset

bind = $mainMod, G, togglegroup
bind = $mainMod, bracketleft, workspace, m-1
bind = $mainMod, bracketright, workspace, m+1

# -- MOUSE CONTROLS --
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# -- MEDIA CONTROLS --
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volnoti.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volnoti.sh down
bindel = , XF86AudioMute, exec, ~/.config/hypr/scripts/volnoti.sh mute
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brinoti.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brinoti.sh down
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# -- POWER & SESSION --
bind = $mainMod CTRL, R, exec, systemctl reboot
bind = $mainMod CTRL, P, exec, systemctl poweroff
bind = $mainMod CTRL, S, exec, systemctl suspend

# -- QUALITY OF LIFE --
bind = $mainMod, S, exec, bash -c "hyprshot -m window -o ~/Pictures/Screenshots"
bind = $mainMod SHIFT, S, exec, bash -c "hyprshot -m region -o ~/Pictures/Screenshots"
bind = $mainMod SHIFT, R, exec, hyprctl reload

# ========================================
# WINDOW RULES
# ========================================

# -- PICTURE-IN-PICTURE --
windowrulev2 = float, title:(Picture-in-Picture|Pip)
windowrulev2 = pin, title:(Picture-in-Picture|Pip)
windowrulev2 = keepaspectratio, title:(Picture-in-Picture|Pip)
windowrulev2 = size 15%, title:(Picture-in-Picture|Pip)
windowrulev2 = move 75% 65%, title:(Picture-in-Picture|Pip)
windowrulev2 = noshadow, title:(Picture-in-Picture|Pip)
windowrulev2 = float, initialClass:(crx_.*)
windowrulev2 = pin, initialClass:(crx_.*)
windowrulev2 = keepaspectratio, initialClass:(crx_.*)
windowrulev2 = size 15%, initialClass:(crx_.*)
windowrulev2 = move 75% 65%, initialClass:(crx_.*)
windowrulev2 = noshadow, initialClass:(crx_.*)

# -- GENERAL RULES --
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nomaximizerequest, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = noblur, class:(brave|firefox|chromium|zen|helium)
windowrulev2 = xwayland, class:(brave|chromium|helium|zen)
windowrulev2 = fullscreen, class:(steam|lutris|heroic|gamescope)
windowrulev2 = noanim, class:(steam|lutris|heroic|gamescope)
windowrulev2 = noblur, class:(steam|lutris|heroic|gamescope)
windowrulev2 = noborder, class:(steam|lutris|heroic|gamescope)
windowrulev2 = float, class:(pavucontrol|blueman-manager|nm-connection-editor|polkit|kvantummanager|nwg-look)
windowrulev2 = size 60% 70%, class:(pavucontrol|blueman-manager|nm-connection-editor)
windowrulev2 = center, class:(pavucontrol|blueman-manager|nm-connection-editor)
windowrulev2 = opacity 0.8 0.95, class:(.*)

# ========================================
# MISCELLANEOUS SETTINGS
# ========================================

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    vfr = true
    vrr = 0
}

################################################################
#                           END                                #
################################################################
