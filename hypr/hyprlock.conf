# --------------------------------------------------------------------------------------
# Gruvbox Dark Palette
# --------------------------------------------------------------------------------------

# Gruvbox Colors (Dark Hard, Soft, or Medium palette - using Medium here)
$bg = #282828           # Base Background
$fg = #ebdbb2           # Foreground/Text
$red = #cc241d           # Red/Error
$green = #98971a         # Green/Accent Success
$yellow = #d79921        # Yellow/Accent Warning/Caps
$blue = #458588          # Blue
$purple = #b16286        # Purple

# Variables
$accent = $yellow                # Primary Accent Color (Gruvbox Yellow is traditional)
$accentAlpha = rgba(215, 153, 33, 0.7) # Accent with alpha (Yellow)
$font = CaskaydiaMono Nerd Font   # Font style

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = /home/yhwach/.config/WALLS/SHANKS.png
    blur_passes = 2
    blur_size = 5
    color = $bg   # Dark base background from Gruvbox palette
}

# TIME LABEL (Right-aligned, Gruvbox style)
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"  # Current time (HH:MM)
    color = $fg   # Gruvbox Text color
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE LABEL (Right-aligned, Everforest style)
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"  # Full date
    color = $yellow   # Gruvbox Text color
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}


# INPUT FIELD (Matching Everforest aesthetic)
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent    # Accent color for input border
    inner_color = #3c3836    # Gruvbox background for input area
    font_color = $font     # Text color
    fade_on_empty = false
    hide_input = false
    check_color = $accent
    fail_color = $red    # Fail color (Light accent for failed attempts)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $purple    # Purple for capslock
    position = 0, -35
    halign = center
    valign = center
}
