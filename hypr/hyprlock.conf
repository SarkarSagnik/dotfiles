source = $HOME/.config/hypr/everforest.conf

# Accent and Background Colors (Everforest Palette)
$accent = #8A9E7D            # Accent Green
$accentAlpha = rgba(138, 158, 125, 0.75)  # Accent with alpha
$font = CaskaydiaMono Nerd Font  # Font style matching Everforest

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = /home/yhwach/Pictures/Walls/wallpaper.jpg
    blur_passes = 2
    color = #2A2E2B   # Dark base background from Everforest palette
}

# TIME LABEL (Right-aligned, Everforest style)
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"  # Current time (HH:MM)
    color = #D1D1A8   # Everforest Text color
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE LABEL (Right-aligned, Everforest style)
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"  # Full date
    color = #D1D1A8   # Everforest Text color
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# USER AVATAR (Simple rounded avatar, Everforest-inspired)
image {
    monitor =
    path = ~/.face    # User's avatar image
    size = 100
    border_color = $accent
    border_width = 4

    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD (Matching Everforest aesthetic)
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent    # Accent color for input border
    inner_color = #1F1F1A    # Everforest background for input area
    font_color = #D1D1A8     # Text color
    fade_on_empty = false
    hide_input = false
    check_color = $accent
    fail_color = #F2C6A0    # Fail color (Light accent for failed attempts)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = #F2C6A0    # Yellow for capslock
    position = 0, -35
    halign = center
    valign = center
}

