#################################
#          Animations           #
#################################
# Enable animations for smooth and aesthetic window transitions
animations = true;

# Animation speed for windows in the current tag (e.g., opening a window)
# Decreased to 120 for smoother, more deliberate motion
animation-stiffness-in-tag = 120;

# Animation speed when changing tags
# Decreased to 100 for fluid tag switches
animation-stiffness-tag-change = 100.0;

# Reduced window mass for lighter, more responsive animations
animation-window-mass = 0.3;

# Increased dampening for minimal oscillation, enhancing smoothness
animation-dampening = 20;

# Keep clamping enabled to prevent overshooting
animation-clamping = true;

# Open windows with a fade effect for a subtle, modern entrance
animation-for-open-window = "fade";

# Minimize or close windows with a fade effect for a soft exit
animation-for-unmap-window = "fade";

# Popup/transient windows with a slide-up effect for consistency
animation-for-transient-window = "slide-up";

# Windows transitioning out when changing tags use slide-out for elegance
animation-for-prev-tag = "slide-out";

# Enable fading for smooth tag transitions
enable-fading-prev-tag = true;

# Windows transitioning in when changing tags use slide-in for consistency
animation-for-next-tag = "slide-in";

# Enable fading for smooth tag transitions
enable-fading-next-tag = true;

#################################
#             Corners           #
#################################
# Rounded corners for a modern, aesthetic look
corner-radius = 10.0;
rounded-corners-exclude = [
    "class_g = 'awesome'",
    "class_g = 'URxvt'",
    "class_g = 'XTerm'",
    "class_g = 'kitty'",
    "class_g = 'Alacritty'",
    "class_g = 'Polybar'",
    "class_g = 'code-oss'",
    "class_g = 'firefox'",
    "class_g = 'Thunderbird'"
];
round-borders = 1;
round-borders-exclude = [];

#################################
#             Shadows           #
#################################
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [
    "class_g = 'slop'"
];

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.8;
frame-opacity = 0.7;
popup_menu = { opacity = 0.8; }
dropdown_menu = { opacity = 0.8; }
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",
    "class_g = 'slop'"
];

opacity-rule = [
    "80:class_g = 'Bar'",
    "100:class_g = 'slop'",
    "100:class_g = 'XTerm'",
    "100:class_g = 'URxvt'",
    "100:class_g = 'kitty'",
    "90:class_g = 'Alacritty'",
    "80:class_g = 'Polybar'",
    "100:class_g = 'code-oss'",
    "100:class_g = 'Meld'",
    "70:class_g = 'TelegramDesktop'",
    "90:class_g = 'Joplin'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Thunderbird'",
    "80:class_g = 'Code'",
    "95:class_g = 'Brave-browser'",
    "80:class_g = 'Zen'"
];

#################################
#     Background-Blurring       #
#################################
blur: {
    # Use kawase blur for a lightweight,-modern effect
    method = "kawase";
    # Low strength for subtle blur to avoid performance hits
    strength = 4;
    # Enable blur for semi-transparent/ARGB windows
    background = true;
    # Disable blur for window frames to reduce GPU load
    background-frame = false;
    # Use fixed blur strength for consistency
    background-fixed = true;
    # Small 3x3 box kernel for minimal blur effect
    kern = "3x3box";
}

# Exclude blur for gaming and utility windows to prevent glitches and optimize performance
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "class_g = 'Polybar'",
    "class_g = 'Steam'",
    "class_g = 'Lutris'",
    "class_g = 'wine'",
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       General Settings        #
#################################
experimental-backends = true;
backend = "glx";
vsync = true;
refresh-rate = 144;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = false;
log-level = "info";

wintypes:
{
    normal = { fade = false; shadow = false; };
    tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.8; };
    dropdown_menu = { opacity = 0.8; };
};
