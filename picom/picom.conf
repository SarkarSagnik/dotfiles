#################################
# Backend & General Performance #
#################################
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
glx-copy-from-front = false;
glx-swap-method = 2;

unredir-if-possible = true;
unredir-if-possible-delay = 500;
unredir-if-possible-exclude = ["class_g = 'Heroic'", "class_g = 'steam'", "class_g = 'heroic'"];
focus-exclude = ["class_g = 'slop'"];

#################################
# Fading and Animations         #
#################################
fading = true;
fade-delta = 10;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [ ];

#################################
# Shadows (Optional)            #
#################################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.4;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
# Blur                         #
#################################
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'dock'",
  "class_g = 'slop'",
  "class_g = 'i3-frame'"
];

#################################
# Rounded Corners              #
#################################
rounded-corners = true;
corner-radius = 12;

# Optional: exclude certain windows from rounding
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'slop'"
];
