[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 25pt
radius = 0
background = ${colors.base}
foreground = ${colors.text}
bottom = false
line-size = 8pt
border-size = 4pt
border-color = #00000000
padding-left = 5
padding-right = 5
module-margin = 1
separator = |
separator-foreground = ${colors.flamingo}
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=12"
modules-left = rofi_powermenu xworkspaces xwindow
modules-center = date
modules-right = pulseaudio battery brightness memory cpu bluetooth_click wifi_click
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.mauve}
label-active-foreground = ${colors.crust}
label-active-underline= ${colors.mauve}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.rosewater}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted =  muted
label-muted-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/get-brightness.sh
interval = 5
click-left = ~/.config/polybar/scripts/rofi-brightness-wrapper.sh
click-right = brightnessctl -d intel_backlight set +5%
click-middle = brightnessctl -d intel_backlight set 5%-
label-foreground = ${colors.yellow}
label-font = 0

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery]
type = internal/battery
full-at = 99
battery = BAT1
adapter = ACAD
poll-interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.primary}
format-charging =  <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750
animation-charging-foreground = ${colors.peach}
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
low-at = 5

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = 睊 Disconnected
label-disconnected-foreground = ${colors.disabled}

;[module/wlan]
;inherit = network-base
;interface-type = wireless
;label-connected =   %essid%
;click-left = sh -c '~/.config/polybar/scripts/rofi-wifi-menu.sh'

[module/bluetooth_click]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth-device-name.sh
interval = 10
click-left = ~/.config/polybar/scripts/rofi-bluetooth-menu.sh
label-foreground = ${colors.teal}

[module/wifi_click]
type = custom/script
exec = bash -c 'ssid=$(iwgetid -r); echo "  ${ssid:-Disconnected}"'
interval = 10
click-left = ~/.config/polybar/scripts/rofi-wifi-menu.sh
label-foreground = ${colors.sky}
label-font = 0

[module/eth]
inherit = network-base
interface-type = wired
label-connected = 󰈁 %local_ip%

[module/date]
type = internal/date
interval = 1
fixed-center = true

; Main display - time & date
date =  %A, %b %d  |    %I:%M %p
; Alt display with seconds and full year
date-alt =  %A, %B %d, %Y  |   %I:%M:%S %p

; Label format
label = %date%
label-padding = 2
label-foreground = ${colors.primary}

; Optional underline or background color
; label-background = ${colors.background-alt}
; label-underline = ${colors.accent}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/rofi_powermenu]
type = custom/script
exec = echo "⏻"
interval = 0
click-left = ~/.config/polybar/scripts/rofi_powermenu.sh
label-font = 0
label-foreground = ${colors.red}
